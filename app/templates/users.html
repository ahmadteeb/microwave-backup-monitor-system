{% extends 'base.html' %}

{% block content %}
<div class="dashboard-layout">
  <div class="table-container">
    <div class="table-header">
      <div class="table-title">
        USER MANAGEMENT <span class="table-count-badge" id="users-count-badge">0 TOTAL</span>
      </div>
      <div class="table-actions">
        <div class="table-filters">
          <input type="text" id="users-search-input" class="sidebar-search" placeholder="SEARCH USERS..." style="font-family: var(--font-body), 'Font Awesome 6 Free'; font-weight: 500; width: 260px;">
          <select id="users-role-filter" class="filter-select">
            <option value="ALL">All Roles</option>
          </select>
          <select id="users-status-filter" class="filter-select">
            <option value="ALL">All Statuses</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
            <option value="Locked">Locked</option>
          </select>
        </div>
        <div class="table-action-buttons">
          <button class="btn-primary" id="btn-add-user"><i class="fa-solid fa-plus"></i> ADD USER</button>
        </div>
      </div>
    </div>
    <div class="table-scroll-wrapper" style="max-height: calc(100vh - 240px); overflow-y: auto;">
      <table>
        <thead>
          <tr>
            <th>NAME</th>
            <th>USERNAME</th>
            <th>EMAIL</th>
            <th>ROLE</th>
            <th>STATUS</th>
            <th>LAST LOGIN</th>
            <th style="text-align: right;">ACTIONS</th>
          </tr>
        </thead>
        <tbody id="users-table-body"></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (document.getElementById('users-table-body')) {
      loadUsers();
    }
  });
</script>
{% endblock %}

{% block extra_modals %}
<div class="modal-overlay" id="user-modal">
  <div class="modal settings-modal">
    <div class="modal-header">
      <div class="modal-title"><i class="fa-solid fa-user-pen text-teal"></i> <span id="user-modal-title">CREATE USER</span></div>
      <button class="modal-close" id="btn-close-user-modal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="user-modal-id">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="user-modal-fullname" class="form-control text-mono" required>
      </div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="user-modal-username" class="form-control text-mono" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="user-modal-email" class="form-control text-mono" required>
      </div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select id="user-modal-role" class="form-control"></select>
      </div>
      <div class="form-group" id="user-modal-password-group">
        <label class="form-label" id="user-modal-password-label">Password</label>
        <input type="password" id="user-modal-password" class="form-control" autocomplete="new-password" placeholder="Min 8 characters">
        <div class="form-helper" id="user-modal-password-helper">Default: ChangeMe123! if blank</div>
      </div>
      <div class="form-group">
        <label class="toggle-switch">
          <input type="checkbox" id="user-modal-active" checked>
          <span class="toggle-track"></span>
          Active
        </label>
      </div>
      <div class="form-group">
        <label class="toggle-switch">
          <input type="checkbox" id="user-modal-force-pw" checked>
          <span class="toggle-track"></span>
          Force password change
        </label>
      </div>
      <div id="user-modal-error" class="auth-error hidden" style="grid-column: span 2;">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="user-modal-error-text"></span>
      </div>
    </div>
    <div class="modal-footer">
      <div class="modal-actions">
        <button class="btn-ghost" id="btn-cancel-user-modal">CANCEL</button>
        <button class="btn-primary" id="btn-save-user-modal"><i class="fa-regular fa-floppy-disk"></i> SAVE USER</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="reset-password-modal">
  <div class="modal settings-modal">
    <div class="modal-header">
      <div class="modal-title"><i class="fa-solid fa-key text-teal"></i> Reset Password</div>
      <button class="modal-close" id="btn-close-reset-pw"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="reset-pw-user-id">
      <p class="text-secondary" style="margin-bottom: 16px;">Reset password for <strong id="reset-pw-username" class="text-teal"></strong>.</p>
      <div class="form-group full">
        <label class="form-label">New Password</label>
        <input id="reset-pw-new" class="form-control" type="password" placeholder="At least 8 characters" autocomplete="new-password">
      </div>
      <div class="form-group full">
        <label class="form-label">Confirm Password</label>
        <input id="reset-pw-confirm" class="form-control" type="password" placeholder="Confirm new password" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="toggle-switch">
          <input type="checkbox" id="reset-pw-force" checked>
          <span class="toggle-track"></span>
          Force password change on next login
        </label>
      </div>
      <div id="reset-pw-error" class="auth-error hidden" style="grid-column: span 2;">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="reset-pw-error-text"></span>
      </div>
    </div>
    <div class="modal-footer">
      <div class="modal-actions">
        <button class="btn-ghost" id="btn-cancel-reset-pw">CANCEL</button>
        <button class="btn-primary" id="btn-save-reset-pw"><i class="fa-solid fa-key"></i> RESET PASSWORD</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
